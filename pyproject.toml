[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ownerwatch-mcp"
version = "0.1.0"
description = "MCP server with read-only tools that map who controls EVM contracts: owners, proxy admins, Safes, timelocks, roles. Built on ownerwatch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "imal1ice" }]
requires-python = ">=3.10"
dependencies = ["ownerwatch>=0.12.1", "mcp>=2.3,<3"]
keywords = ["mcp", "model-context-protocol", "ethereum", "evm", "security", "multisig", "timelock", "erc-8241"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/imal1ice/ownerwatch-mcp"
Issues = "https://github.com/imal1ice/ownerwatch-mcp/issues"
ownerwatch = "https://github.com/imal1ice/ownerwatch"

[project.scripts]
ownerwatch-mcp = "ownerwatch_mcp.server:main"

[tool.setuptools.packages.find]
include = ["ownerwatch_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads public mainnet RPCs (set OWNERWATCH_MCP_LIVE=1 to run)"]
